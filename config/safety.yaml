# Safety rules. Must be reviewed by a licensed mental-health professional before public launch.
#
# If a user's message contains any phrase below (case-insensitive), the app does NOT call the
# model. It shows crisis_message instead and pauses the reflection. The conversation prompt also
# tells the model to share these resources if it notices distress these phrases miss.

crisis_phrases:
  - suicide
  - suicidal
  - kill myself
  - killing myself
  - end my life
  - ending my life
  - take my own life
  - want to die
  - wanna die
  - better off dead
  - better off without me
  - no reason to live
  - nothing to live for
  - don't want to be alive
  - dont want to be alive
  - don't want to live
  - dont want to live
  - hurt myself
  - hurting myself
  - harm myself
  - self-harm
  - self harm
  - cutting myself
  - overdose

crisis_message: |
  It sounds like you might be going through something really hard right now, and that matters more than anything we were talking about. I'm an AI reflection tool, not a counselor, so I'm not the right support for this. Please reach out to someone who is:

  - **988 Suicide & Crisis Lifeline** (US): call or text **988**, or chat at 988lifeline.org. Free, confidential, 24/7.
  - **Crisis Text Line** (US): text **HOME** to **741741**.
  - **NAMI HelpLine** (US): call **1-800-950-6264** or text "helpline" to **62640** (weekdays).
  - **Outside the US**: findahelpline.com lists free local services.
  - **In immediate danger**: call **911** or your local emergency number.

  You don't have to go through this alone. When you're ready, you're welcome to come back here.
