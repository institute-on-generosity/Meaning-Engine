# MeaningEngine settings. Changes take effect on the next deploy (or dev-server restart).
# IoG's documents are listed in config/corpus.json, written by `npm run corpus`.

llm:
  # Provider code lives in lib/llm.ts. To use another provider, add a class there and register it in PROVIDERS.
  provider: anthropic
  # The conversation itself. Swap for claude-sonnet-5-5 or claude-haiku-5-5 to cut cost (see README "Cost").
  chat_model: claude-opus-5-5
  chat_effort: low          # low | medium | high. Low keeps replies quick; the prompt does the steering.
  # The end-of-session giving reflection.
  reflection_model: claude-opus-5-5
  reflection_effort: medium

limits:
  # Per visitor IP. A whole convening on one Wi-Fi network shares an IP, so keep these generous;
  # the Anthropic workspace's monthly spend limit is the real cost cap (see docs/staff-guide.md).
  chat_per_ip_per_10_min: 120
  reflections_per_ip_per_hour: 30

kiosk:
  # At /kiosk, the screen clears for the next person after this much inactivity.
  idle_seconds: 180
  warning_seconds: 30       # how long the "Still there?" countdown shows before clearing

session:
  max_user_turns: 40        # hard stop for a single session
  max_message_chars: 4000
  reflection_after_turns: 4 # the "Create my reflection" button appears after this many user messages

opening_message: >-
  Welcome. This is a space to think about your giving: why you give, what you care about,
  and what you're unsure about. There are no right answers. To start, what's on your mind
  about your giving right now?
